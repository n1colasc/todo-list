<ion-segment class="margin-top">
  <ion-segment-button value="ta" content-id="ta1">
    <ion-label>Tareas</ion-label>
  </ion-segment-button>
  <ion-segment-button value="cat" content-id="cat1">
    <ion-label>Categorías</ion-label>
  </ion-segment-button>
</ion-segment>
<ion-segment-view>
  <ion-segment-content id="ta1">
    <ion-content class="content-style">
      <ion-list>
        <ion-item lines="none">
          <div class="input-container">
            <ion-label position="stacked">Título de la tarea</ion-label>
            <ion-input
              class="custom-input"
              [(ngModel)]="titleTask"
              placeholder="Ej: Pasear al perro"
            ></ion-input>
          </div>
        </ion-item>
        <ion-item lines="none">
          <div class="input-container">
            <ion-label position="stacked">Descripción de la tarea</ion-label>
            <ion-textarea
              class="custom-input medium-input"
              [(ngModel)]="descriptionTask"
              placeholder="Ej: Pasear al perro"
            ></ion-textarea>
          </div>
        </ion-item>
        <ion-item lines="none">
          <div class="input-container">
            <ion-label position="stacked">Categoría</ion-label>
            <ion-select
              class="custom-input"
              placeholder="Selecciona una categoría"
              [(ngModel)]="selectedCategoryId"
              interface="popover"
            >
              <ion-select-option
                *ngFor="let category of dataService.categories"
                [value]="category.id"
              >
                {{ category.name }}
              </ion-select-option>
            </ion-select>
          </div>
        </ion-item>
        <ion-item lines="none">
          <div class="button-date">
            <p>Fecha de inicio</p>
            <ion-button id="open-modal" expand="block">
              <ion-icon name="calendar-outline"></ion-icon
            ></ion-button>
          </div>
        </ion-item>
        <p class="no-spaces button-date" *ngIf="selectedDate">
          {{ selectedDate | date: 'fullDate' }} {{ selectedDate | date:
          'shortTime' }}
        </p>
      </ion-list>
      <ion-modal
        trigger="open-modal"
        [initialBreakpoint]="0.5"
        [breakpoints]="[0, 0.5, 0.75, 1]"
        handleBehavior="cycle"
      >
        <ng-template>
          <ion-content class="ion-padding">
            <ion-datetime
              locale="es-CO"
              hourCycle="h12"
              presentation="date-time"
              preferWheel="false"
              class="full-datetime"
              (ionChange)="onDateChange($event)"
            ></ion-datetime>
          </ion-content>
        </ng-template>
      </ion-modal>
      <ion-button
        class="flex-center button-success"
        *ngIf="showFunc"
        (click)="addTask()"
        color="success"
        >Agregar tarea<ion-icon name="bookmark-outline"></ion-icon
      ></ion-button>
    </ion-content>
  </ion-segment-content>
  <ion-segment-content id="cat1">
    <ion-content class="content-style">
      <ion-list>
        <ion-item lines="none">
          <div class="input-container">
            <ion-label position="stacked">Título de la categoría</ion-label>
            <ion-input
              class="custom-input"
              [(ngModel)]="newCategory"
              placeholder="Ej: Universidad"
            ></ion-input>
          </div>
        </ion-item>
      </ion-list>
      <ion-button
        class="flex-center button-success"
        *ngIf="showFunc"
        (click)="addCategory()"
        color="success"
        >Agregar categoría<ion-icon name="bookmark-outline"></ion-icon
      ></ion-button>
    </ion-content>
  </ion-segment-content>
</ion-segment-view>
